<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>團購即時登記系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;700&display=swap');
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <nav class="bg-emerald-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fas fa-shopping-basket"></i>
                團購登記助手
            </h1>
            <div id="connection-status" class="text-xs bg-emerald-700 px-3 py-1 rounded-full flex items-center gap-2">
                <span class="w-2 h-2 bg-yellow-400 rounded-full animate-pulse"></span>
                連線中...
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 mt-8">
        <div class="glass-card rounded-2xl shadow-sm p-6 mb-6 border-l-4 border-emerald-500">
            <h2 class="text-lg font-semibold text-slate-700 mb-4 flex items-center gap-2">
                <i class="fas fa-bullhorn text-emerald-500"></i>
                團購主題設定
            </h2>
            <form id="header-form" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">團購發起人</label>
                        <input type="text" id="organizer" placeholder="例如：福委會 小明" class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all bg-emerald-50/30">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">團購主題名稱</label>
                        <input type="text" id="group-title" placeholder="例如：週五午餐團訂" class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all bg-emerald-50/30">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">預設產品名稱</label>
                        <input type="text" id="header-product" placeholder="商品名稱" class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all bg-emerald-50/30">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">預設單價</label>
                        <input type="number" id="header-price" placeholder="0" class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all bg-emerald-50/30">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">產品單位</label>
                        <input type="text" id="header-unit" placeholder="例如：份、箱" class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all bg-emerald-50/30">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">產品與團購描述</label>
                    <textarea id="group-desc" rows="2" placeholder="在此輸入產品特色、截止時間或取貨地點..." class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all bg-emerald-50/30"></textarea>
                </div>
                <div class="flex justify-end">
                    <button type="submit" id="save-header-btn" class="px-6 py-2 bg-slate-700 hover:bg-slate-800 text-white text-sm font-medium rounded-xl transition-all flex items-center gap-2">
                        <i class="fas fa-save"></i>
                        同步主題資訊
                    </button>
                </div>
            </form>
        </div>

        <div class="glass-card rounded-2xl shadow-sm p-6 mb-8 border-t-4 border-emerald-500">
            <h2 class="text-lg font-semibold text-slate-700 mb-4 flex items-center gap-2">
                <i class="fas fa-plus-circle text-emerald-500"></i>
                新增團購資料
            </h2>
            <form id="order-form" class="grid grid-cols-1 md:grid-cols-5 gap-4">
                <div class="md:col-span-1">
                    <label class="block text-sm font-medium text-slate-600 mb-1">團購人</label>
                    <input type="text" id="buyer" required placeholder="姓名" class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all">
                </div>
                <div class="md:col-span-1">
                    <label class="block text-sm font-medium text-slate-600 mb-1">產品名稱</label>
                    <input type="text" id="product" required placeholder="商品" class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">單價</label>
                    <input type="number" id="price" required min="0" placeholder="0" class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">數量</label>
                    <input type="number" id="quantity" required min="1" placeholder="1" class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all">
                </div>
                <div class="flex items-end">
                    <button type="submit" id="submit-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-2 rounded-xl shadow-md transform active:scale-95 transition-all flex items-center justify-center gap-2">
                        <i class="fas fa-paper-plane"></i>
                        加入名單
                    </button>
                </div>
            </form>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-sm text-slate-500">總參與人數</p>
                <p id="total-people" class="text-2xl font-bold text-slate-800">0 人</p>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-sm text-slate-500">總商品數量</p>
                <p id="total-qty" class="text-2xl font-bold text-slate-800">0</p>
            </div>
            <div class="bg-emerald-50 p-5 rounded-2xl shadow-sm border border-emerald-100">
                <p class="text-sm text-emerald-600">整團總金額</p>
                <p id="grand-total" class="text-2xl font-bold text-emerald-700">$ 0</p>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-slate-100">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b border-slate-100">
                        <tr>
                            <th class="px-6 py-4 text-sm font-semibold text-slate-600">團購人</th>
                            <th class="px-6 py-4 text-sm font-semibold text-slate-600">團購產品</th>
                            <th class="px-6 py-4 text-sm font-semibold text-slate-600 text-right">單價</th>
                            <th class="px-6 py-4 text-sm font-semibold text-slate-600 text-right">數量</th>
                            <th class="px-6 py-4 text-sm font-semibold text-slate-600 text-right">小計</th>
                            <th class="px-6 py-4 text-sm font-semibold text-slate-600 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="order-list" class="divide-y divide-slate-50">
                        <!-- 資料將由 JS 生成 -->
                        <tr>
                            <td colspan="6" class="px-6 py-12 text-center text-slate-400">
                                <div class="flex flex-col items-center gap-2">
                                    <i class="fas fa-inbox text-3xl opacity-20"></i>
                                    <p>目前尚無登記資料，趕快來搶頭香！</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <div id="toast-content" class="bg-slate-800 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3">
            <i class="fas fa-info-circle text-emerald-400"></i>
            <span id="toast-msg">操作成功</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, addDoc, onSnapshot, deleteDoc, query, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";


        // 環境變數
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'group-buy-app';
        const firebaseConfig = JSON.parse(__firebase_config);

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // UI 元素
        const orderForm = document.getElementById('order-form');
        const headerForm = document.getElementById('header-form');
        const orderList = document.getElementById('order-list');
        const connStatus = document.getElementById('connection-status');
        const totalPeopleEl = document.getElementById('total-people');
        const totalQtyEl = document.getElementById('total-qty');
        const grandTotalEl = document.getElementById('grand-total');
        
        let currentUnit = '件'; // 預設單位

        async function init() {
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        connStatus.innerHTML = `<span class="w-2 h-2 bg-emerald-400 rounded-full"></span> 雲端連線中`;
                        startListening();
                        syncHeaderData();                    }
                });
            } catch (error) {
                console.error("Auth failed", error);
                showToast("連線失敗，請重新整理頁面", "error");
            }
        }

        function syncHeaderData() {
            const headerRef = doc(db, 'artifacts', appId, 'public', 'data', 'meta', 'header');
            
            onSnapshot(headerRef, (doc) => {
                if (doc.exists()) {
                    const data = doc.data();
                    // 更新設定區塊
                    document.getElementById('organizer').value = data.organizer || '';
                    document.getElementById('group-title').value = data.title || '';
                    document.getElementById('group-desc').value = data.description || '';
                    document.getElementById('header-product').value = data.defaultProduct || '';
                    document.getElementById('header-price').value = data.defaultPrice || '';
                    document.getElementById('header-unit').value = data.defaultUnit || '';
                    
                    // 更新全域單位變數
                    currentUnit = data.defaultUnit || '件';

                    // 自動帶入下方登記區塊 (若使用者尚未手動修改)
                    const productInput = document.getElementById('product');
                    const priceInput = document.getElementById('price');
                    
                    if (data.defaultProduct) productInput.value = data.defaultProduct;
                    if (data.defaultPrice) priceInput.value = data.defaultPrice;
                    
                    // 重新觸發一次列表渲染，以更新單位顯示
                    startListening();
                }
            }, (err) => console.error("Header sync failed", err));

            // 儲存更新到雲端
            headerForm.onsubmit = async (e) => {
                e.preventDefault();
                const btn = document.getElementById('save-header-btn');
                btn.disabled = true;
                btn.innerHTML = `<i class="fas fa-spinner animate-spin"></i> 同步中...`;

                try {
                    await setDoc(headerRef, {
                        organizer: document.getElementById('organizer').value.trim(),
                        title: document.getElementById('group-title').value.trim(),
                        description: document.getElementById('group-desc').value.trim(),
                        defaultProduct: document.getElementById('header-product').value.trim(),
                        defaultPrice: document.getElementById('header-price').value,
                        defaultUnit: document.getElementById('header-unit').value.trim(),
                        updatedAt: Date.now()
                    }, { merge: true });
                    showToast("主題資訊、預設值與單位已同步");
                } catch (err) {
                    showToast("同步失敗", "error");
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fas fa-save"></i> 同步主題資訊`;
                }
            };
        }

        function startListening() {
            const ordersRef = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
            
            onSnapshot(ordersRef, (snapshot) => {
                const orders = [];
                snapshot.forEach(doc => {
                    orders.push({ id: doc.id, ...doc.data() });
                });

                orders.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                
                renderOrders(orders);
                updateSummary(orders);
            }, (error) => {
                console.error("Fetch failed", error);
            });
        }

        function renderOrders(orders) {
            if (orders.length === 0) {
                orderList.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-slate-400"><div class="flex flex-col items-center gap-2"><i class="fas fa-inbox text-3xl opacity-20"></i><p>目前尚無登記資料</p></div></td></tr>`;
                return;
            }

            orderList.innerHTML = orders.map(order => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-6 py-4 font-medium text-slate-700">${order.buyer}</td>
                    <td class="px-6 py-4 text-slate-600">${order.product}</td>
                    <td class="px-6 py-4 text-right text-slate-600">$ ${Number(order.price).toLocaleString()}</td>
                    <td class="px-6 py-4 text-right text-slate-600">${order.quantity} ${currentUnit}</td>
                    <td class="px-6 py-4 text-right font-bold text-emerald-600">$ ${(order.price * order.quantity).toLocaleString()}</td>
                    <td class="px-6 py-4 text-center">
                        <button onclick="deleteOrder('${order.id}')" class="text-slate-300 hover:text-red-500 transition-colors p-2">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function updateSummary(orders) {
            const uniqueBuyers = new Set(orders.map(o => o.buyer)).size;
            const totalQty = orders.reduce((sum, o) => sum + Number(o.quantity), 0);
            const grandTotal = orders.reduce((sum, o) => sum + (o.price * o.quantity), 0);

            totalPeopleEl.innerText = `${uniqueBuyers} 人`;
            totalQtyEl.innerText = `${totalQty} ${currentUnit}`;
            grandTotalEl.innerText = `$ ${grandTotal.toLocaleString()}`;
        }

        orderForm.onsubmit = async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) return;

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner animate-spin"></i> 處理中...`;

            const orderData = {
                buyer: document.getElementById('buyer').value.trim(),
                product: document.getElementById('product').value.trim(),
                price: Number(document.getElementById('price').value),
                quantity: Number(document.getElementById('quantity').value),
                createdAt: Date.now(),
                uid: user.uid
            };

            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'orders'), orderData);
                orderForm.reset();
                showToast("登記成功！");
            } catch (error) {
                console.error("Add failed", error);
                showToast("儲存失敗，請重試");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-paper-plane"></i> 加入名單`;
            }
        };

        window.deleteOrder = async (id) => {
            if (!confirm("確定要刪除這筆登記嗎？")) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', id));
                showToast("已刪除該筆資料");
            } catch (error) {
                showToast("刪除失敗");
            }
        };

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastContent = document.getElementById('toast-content');
            
            toastMsg.innerText = msg;
            toastContent.className = type === 'success' 
                ? "bg-slate-800 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3"
                : "bg-red-600 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3";
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // 啟動程式
        init();

    </script>
</body>
</html>
